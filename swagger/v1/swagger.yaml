---
openapi: 3.0.1
info:
  title: API V1
  version: v1
servers:
  - url: http://{defaultHost}
    variables:
      defaultHost:
        default: localhost:3000
paths:
  "/api/v1/login":
    post:
      summary: Create session (login)
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Login successful, returns access token
  "/api/v1/logout":
    delete:
      summary: Delete session (logout)
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
  "/api/v1/products":
    get:
      summary: List all products
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            description: Sort order, e.g., "created_at:desc"
          value: "created_at:desc"
        - name: filters
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
          description: |
            Filters to apply, e.g., filters[category]=1&filters[name]=ProductName
          value: '{
            "name": "Allan",
            "min_price": 30,
            "max_price": 500,
            "category_id": 3,
            "user_id": 43
            }'
        - name: page
          in: query
          schema:
            type: integer
            description: Page number for pagination
          value: 1
        - name: per_page
          in: query
          schema:
            type: integer
            description: Number of items per page
          value: 10
      responses:
        "200":
          description: A list of products
  "/api/v1/products/{id}":
    get:
      summary: Get a product by ID
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
        "404":
          description: Product not found
  "/api/v1/orders":
    post:
      summary: Create a new order
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    order_items_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          product_id:
                            type: integer
                        required:
                          - product_id
                  required:
                    - order_items_attributes
              required:
                - order
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Invalid input
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use the /api/v1/login endpoint to get an access token.
        Then click "Authorize" in Swagger UI and paste your token (without the 'Bearer ' prefix).
        Example: `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...`
security:
  - bearerAuth: []

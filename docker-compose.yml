version: '3'
services:
  db:
    image: postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build: .
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: rails server -b 0.0.0.0
  redis:
    image: redis:latest
    container_name: ror-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  redis_data: